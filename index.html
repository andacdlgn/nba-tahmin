<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1620">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NBA Tahmin</title>
<meta name="description" content="Her gecenin NBA maçlarına tahmin: kazanan, fark ve en skorer. Canlı skor ve puan tablosu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="NBA Tahmin">
<meta name="mobile-web-app-capable" content="yes">
<script>try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<script>
// Açılış ekranı + sürüm kontrolü. Her güncellemede BUILD, version.json, app.js'deki VERSION ve
// aşağıdaki ?v= numaraları birlikte artırılır (scripts/surum.py hepsini birden yapar).
window.BUILD = "v5";
(function(){
  var t0 = Date.now(), MIN = 2000, MAX = 8000, ready = false, done = false;
  function hide(){ if(done) return; done = true; var s = document.getElementById("splash"); if(!s) return; s.classList.add("out"); setTimeout(function(){ s.remove(); }, 700); }
  function tryHide(){ if(ready && Date.now() - t0 >= MIN) hide(); }
  window.addEventListener("app-ready", function(){ ready = true; setTimeout(tryHide, Math.max(0, MIN - (Date.now() - t0))); });
  setTimeout(function(){ ready = true; tryHide(); }, MAX);
  // Sunucudaki sürüm, bu sayfanınkinden yeniyse önbelleği atlayıp yeni dosyaları çek ve bir kez yenile
  fetch("version.json?t=" + Date.now(), {cache: "no-store"}).then(function(r){ return r.json(); }).then(function(j){
    if(!j || !j.v || j.v === window.BUILD) return;
    var k = "upd:" + j.v;
    try{ if(sessionStorage.getItem(k)) return; sessionStorage.setItem(k, "1"); }catch(e){ return; }
    var m = document.getElementById("spMsg"); if(m) m.textContent = "Yeni sürüm yükleniyor…";
    Promise.all(["./", "index.html"].map(function(u){ return fetch(u, {cache: "reload"}).catch(function(){}); }))
      .then(function(){ location.reload(); });
  }).catch(function(){});
})();
</script>
<link rel="stylesheet" href="style.css?v=v5">
</head>
<body>

<!-- AÇILIŞ EKRANI -->
<div id="splash" aria-hidden="true">
  <div class="sp-court"></div>
  <div class="sp-stage">
    <div class="sp-ball"><svg viewBox="0 0 100 100"><defs><radialGradient id="spG" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffa25a"/><stop offset=".55" stop-color="#e8692a"/><stop offset="1" stop-color="#b9471a"/></radialGradient></defs>
      <circle cx="50" cy="50" r="46" fill="url(#spG)"/><g fill="none" stroke="#2a1408" stroke-width="3" stroke-linecap="round"><circle cx="50" cy="50" r="46"/><path d="M50 4v92M4 50h92"/><path d="M19 15c15 15 15 55 0 70M81 15c-15 15-15 55 0 70"/></g></svg></div>
    <div class="sp-shadow"></div>
  </div>
  <div class="sp-title cond">NBA Tahmin</div>
  <div class="sp-msg" id="spMsg">Maçlar yükleniyor…</div>
</div>

<div class="topbar">
  <div class="wrap">
    <div class="brand cond">NBA Tahmin</div>
    <div class="mini" id="mini" aria-hidden="true"></div>
    <div class="tb-right">
      <button class="rules-btn" id="rulesBtn" type="button">Kurallar</button>
      <button class="icon-btn" id="theme" type="button"></button>
      <button class="icon-btn hide" id="me" type="button" aria-label="Hesap"></button>
    </div>
  </div>
</div>

<!-- GİRİŞ -->
<section id="auth" class="wrap hide" aria-labelledby="authTitle">
  <div class="auth-card">
    <h1 id="authTitle" class="cond">Oyuna gir</h1>
    <p class="muted">Her gecenin maçlarına tahmin yap: kazanan, fark ve en skorer.</p>
    <div class="chips" role="tablist" id="authMode">
      <button class="chip" data-v="login" aria-pressed="true">Giriş</button>
      <button class="chip" data-v="join" aria-pressed="false">Yeni oyuncu</button>
    </div>
    <form id="authForm" autocomplete="on">
      <label class="fld" id="fName"><span>Adın</span>
        <input id="inName" list="playerNames" autocomplete="username" maxlength="40" required placeholder="ör. Andaç">
        <datalist id="playerNames"></datalist>
        <small class="hint hide" id="nameHint">Büyük harfle başlamalı. Küfür, argo ya da hakaret içeremez.</small>
      </label>
      <div class="sec-q hide" id="fSec">
        <div class="sec-head" id="secHead">Güvenlik sorusu <small>Şifreni unutursan bu ikisiyle sıfırlarsın.</small></div>
        <div id="secPick"></div>
      </div>
      <label class="fld"><span id="pinLbl">Şifre (6 hane)</span>
        <input id="inPin" type="password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="current-password" required placeholder="••••••">
      </label>
      <label class="fld hide" id="fInvite"><span>Davet kodu</span>
        <input id="inInvite" autocomplete="off" maxlength="40" placeholder="Oyunu kuran kişiden al">
      </label>
      <p class="err" id="authErr" role="alert"></p>
      <button class="btn-primary" id="authBtn" type="submit">Giriş yap</button>
      <button class="linkish forgot" id="forgotBtn" type="button">Şifremi unuttum</button>
    </form>
    <div id="resetWait" class="hide"></div>
  </div>
</section>

<!-- UYGULAMA -->
<div id="app" class="hide">
  <div class="wrap">
    <section class="board" id="board" aria-label="Skor"></section>
    <div class="ticker" id="ticker" aria-label="Ligden haberler"></div>

    <div id="banners"></div>
    <div id="alert"></div>
    <main>
      <!-- TAHMİN -->
      <section id="view-tahmin" data-view>
        <div class="daynav">
          <button id="dayPrev" aria-label="Önceki gün">‹</button>
          <div class="dl" id="dayLabel"></div>
          <button id="dayNext" aria-label="Sonraki gün">›</button>
        </div>
        <div class="seg2" role="tablist" id="subSel">
          <button data-v="maclar" aria-pressed="true">Maçlar</button>
          <button data-v="tahminler" aria-pressed="false">Günün tahminleri</button>
        </div>
        <div id="dayStatus"></div>
        <div id="subMaclar">
          <div id="dayPlayer"></div>
          <div class="games" id="games"></div>
        </div>
        <div id="subTahminler" class="hide"><div id="dayView"></div></div>
      </section>

      <!-- SONUÇLAR -->
      <section id="view-sonuclar" data-view class="hide">
        <div class="daynav">
          <button id="rdPrev" aria-label="Önceki gün">‹</button>
          <div class="dl" id="rdLabel"></div>
          <button id="rdNext" aria-label="Sonraki gün">›</button>
        </div>
        <div id="results"></div>
      </section>

      <!-- AYRIŞMA -->
      <section id="view-ayrisma" data-view class="hide">
        <div class="sec-title"><h2>Farklı tahminler</h2><span class="aside" id="ayrDay"></span></div>
        <div id="ayrisma"></div>
      </section>

      <!-- PUAN -->
      <section id="view-puan" data-view class="hide">
        <div id="puan"></div>
      </section>

      <!-- İSTATİSTİK -->
      <section id="view-istatistik" data-view class="hide">
        <div id="istatistik"></div>
      </section>

      <footer id="foot"></footer>
    </main>
  </div>

  <nav class="nav" aria-label="Sekmeler">
    <div class="in">
      <span class="nav-pill" id="navPill" aria-hidden="true"></span>
      <a href="#tahmin" data-tab="tahmin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3.5 9.5c4 1 13 1 17 0M3.5 14.5c4-1 13-1 17 0M12 3c-2.5 3-2.5 15 0 18M12 3c2.5 3 2.5 15 0 18"/></svg><span class="live-n hide" id="navLive" aria-label="canlı maç"></span>Tahmin</a>
      <a href="#sonuclar" data-tab="sonuclar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14M7 10v4M17 10v4"/></svg>Sonuçlar</a>
      <a href="#ayrisma" data-tab="ayrisma"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v6M12 9l-6 6v6M12 9l6 6v6"/></svg>Kafa kafaya</a>
      <a href="#puan" data-tab="puan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Puan</a>
      <a href="#istatistik" data-tab="istatistik"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>İstatistik</a>
    </div>
  </nav>
</div>

<!-- Alt pencere (oyuncu seçimi, kutu skoru, maç önü) -->
<div class="sheet-bg hide" id="sheet"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <div class="sh-bar"><div class="grab"></div><button class="sh-close" id="shClose" aria-label="Kapat">✕</button></div>
  <div id="shBody"></div>
</div></div>

<div class="toast hide" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="app.js?v=v5"></script>
</body>
</html>
