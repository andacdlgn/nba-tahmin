<script>
// Açılış ekranı + sürüm kontrolü. Her güncellemede BUILD, version.json, app.js'deki VERSION ve
// aşağıdaki ?v= numaraları birlikte artırılır (scripts/surum.py hepsini birden yapar).
window.BUILD = "1.40.6";
(function(){
  var t0 = Date.now(), MIN = 1000, MAX = 8000, ready = false, done = false;
  function hide(){ if(done) return; done = true; var s = document.getElementById("splash"); if(!s) return; s.classList.add("out"); setTimeout(function(){ s.remove(); }, 450); }
  function tryHide(){ if(ready && Date.now() - t0 >= MIN) hide(); }
  window.addEventListener("app-ready", function(){ ready = true; setTimeout(tryHide, Math.max(0, MIN - (Date.now() - t0))); });
  // 12 sn içinde açılmazsa boş ekran yerine yeniden deneme seçeneği (önbelleği temizleyip yeniler)
  setTimeout(function(){ if(ready) return; var s = document.getElementById("splash"), m = document.getElementById("spMsg"); if(!s || !m) return; s.removeAttribute("aria-hidden");
    m.innerHTML = 'Bağlantı yavaş görünüyor.<br><button id="spRetry" type="button" style="margin-top:12px;padding:10px 18px;border-radius:12px;border:0;font:inherit;font-weight:700;cursor:pointer">Tekrar dene</button>';
    document.getElementById("spRetry").onclick = function(){ var go = function(){ location.replace(location.pathname + location.search); };
      try{ Promise.all([
        ("caches" in window) ? caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); }) : 0,
        (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) ? navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); }) : 0
      ]).then(go, go); }catch(e){ go(); } };
  }, 12000);
  setTimeout(function(){ if(!ready) return; tryHide(); }, MAX);
  // Sunucudaki sürüm, bu sayfanınkinden yeniyse sayfayı yeni sürüm adıyla (?u=1.40.3) yeniden aç.
  // 1.40.4: adres değiştiği için tarayıcı ve GitHub'ın önbelleği eski sayfayı veremez. Push'tan hemen sonra sunucu
  // henüz eskiyi veriyorsa en fazla 4 kez, aralıklarla yeniden denenir (eskiden tek denemeden sonra o oturumda vazgeçiyordu).
  window.ntUpdate = function(newV){
    var k = "upd:" + newV, n = 0;
    try{ n = +(sessionStorage.getItem(k) || 0); if(n >= 4) return false; sessionStorage.setItem(k, String(n + 1)); }catch(e){}
    var m = document.getElementById("spMsg"); if(m) m.textContent = "Yeni sürüm yükleniyor…";
    var q = new URLSearchParams(location.search); q.set("u", newV);
    setTimeout(function(){ location.replace(location.pathname + "?" + q.toString() + location.hash); }, n ? 15000 * n : 0);
    return true;
  };
  fetch("version.json?t=" + Date.now(), {cache: "no-store"}).then(function(r){ return r.json(); }).then(function(j){
    if(!j || !j.v || j.v === window.BUILD) return;
    window.ntUpdate(j.v);
  }).catch(function(){});
})();
</script>
