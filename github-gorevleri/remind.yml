name: Tahmin hatırlatma maili

on:
  schedule:
    # 10 dakikada bir bakar; gecenin ilk maçına 2 saat kala, eksik tahmini olanlara bir kez mail atar.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: remind
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-reset.txt

      - run: pip install -r scripts/requirements-reset.txt

      - name: Hatırlatmaları gönder
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/remind.py
