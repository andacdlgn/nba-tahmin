name: Tahmin hatırlatma maili

# Artık worker.yml çalıştırıyor; bu dosya yalnızca elle çalıştırmak için duruyor.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: remind
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-reset.txt

      - run: pip install -r scripts/requirements-reset.txt

      - name: Hatırlatmaları gönder
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/remind.py
