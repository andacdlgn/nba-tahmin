name: Şifre sıfırlama ve e-posta onayı

# Artık worker.yml çalıştırıyor; bu dosya yalnızca elle çalıştırmak için duruyor.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: reset
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-reset.txt

      - run: pip install -r scripts/requirements-reset.txt

      - name: İstekleri işle
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: python scripts/reset.py

      - name: E-posta onay kodlarını gönder
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/verify.py
