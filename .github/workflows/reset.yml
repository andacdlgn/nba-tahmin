name: Şifre sıfırlama isteklerini işle

on:
  schedule:
    # 5 dakikada bir (GitHub'ın zamanlaması bazen birkaç dakika gecikir).
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: reset
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-reset.txt

      - run: pip install -r scripts/requirements-reset.txt

      - name: İstekleri işle
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: python scripts/reset.py
